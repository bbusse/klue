name: Build and release container

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test-bash-unit:
    uses: bbusse/github-workflows/.github/workflows/run-tests-bash-unit.yml@dev
    with:
      working_directory: .
      enabled: false

  shellcheck:
    uses: bbusse/github-workflows/.github/workflows/shellcheck.yml@dev

  container-build-push:
    needs:
      - test-bash-unit
      - shellcheck
    uses: bbusse/github-workflows/.github/workflows/container-build-push.yaml@dev
    with:
      image_name: 'klue'
      image_repository: 'ghcr.io/bbusse'
      container_registry: 'ghcr'
      container_push_to_registry: true
